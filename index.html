<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" dir="ltr">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="Cobalt.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>GameSense Revive</title>
</head>

<body>
    <div id="punmaint" class="pun">
        <div class="top-box"></div>
        <div class="punwrap">

            <div id="brdmain">
                <div class="block">
                    <h2>Status</h2>
                    <div class="box">
                        <div class="inbox">
                            <p>The old era is gone. Welcome to GameSense Revive — redesigned, rebuilt, and ready.</p>
                            <br>
                            <p><a href="https://discord.gg/MPqZ9McqSA">Join us on discord</a></p>
                            <br>
                            <p><a href="https://gamesense-revive.vercel.app/download">Download latest client</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="end-box"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loaderLink = document.getElementById("loader-link");
            if (loaderLink) {
                const randomHash = Math.random().toString(16).substring(2, 8);
                const randomName = `gs_${randomHash}.exe`;
                
                loaderLink.setAttribute("download", randomName);
            }
        });
    </script>
</body>
