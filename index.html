<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" dir="ltr">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="Cobalt.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>GameSense Revive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0c0c0c;
            overflow-x: hidden;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            gap: 25px;
            perspective: 1000px;
        }

        .menu-preview-container {
            position: relative;
            width: 500px; 
            height: 420px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.1);
            border: 1px solid #222;
            border-radius: 4px;
            background-image: url('image_3.png'); 
            transition: transform 0.1s ease-out, box-shadow 0.2s ease;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .menu-preview-container:hover {
            box-shadow: 0 15px 40px rgba(0, 255, 102, 0.2);
        }

        .pun .inbox p a {
            transition: all 0.2s ease-in-out;
            color: #ccc;
            text-decoration: none;
            cursor: pointer;
        }
        .pun .inbox p a:hover {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .pun .block h2 {
            text-align: center;
            color: #eee;
        }
        .pun .box {
            background: #111111;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 4px;
            width: 460px;
            box-sizing: border-box;
        }
        .pun .inbox {
            text-align: center;
            color: #ccc;
        }

        #build-status {
            display: none;
            font-family: monospace;
            color: #00ff66;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
            background: #080808;
            padding: 12px;
            border: 1px solid #222;
            border-radius: 4px;
            line-height: 1.6;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.05);
        }
    </style>
</head>

<body>
    <div id="punmaint" class="pun">
        <div class="top-box"></div>
        <div class="punwrap">

            <div id="brdmain">
                <div class="main-container">
                    
                    <div class="menu-preview-container" id="interactive-card"></div>

                    <div class="block">
                        <h2>Status</h2>
                        <div class="box">
                            <div class="inbox">
                                <div style="margin-bottom: 15px; font-weight: bold; font-size: 14px;">
                                    Status: <span style="color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.4);">● UNDETECTED</span>
                                </div>
                                <p>Welcome to GameSense Revive — redesigned, rebuilt, and ready.</p>
                                <br>
                                <p><a href="https://discord.gg/MPqZ9McqSA">Join us on discord</a></p>
                                <br>
                                <p><a id="download-btn">Download latest client</a></p>
                                
                                <div id="build-status"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="end-box"></div>
    </div>

    <script>
        const card = document.getElementById('interactive-card');
        const container = document.querySelector('.main-container');

        container.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - (rect.width / 2);
            const y = e.clientY - rect.top - (rect.height / 2);
            
            const rotateX = -(y / (rect.height / 2)) * 10;
            const rotateY = (x / (rect.width / 2)) * 10;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
        });

        document.getElementById('download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('build-status');
            const btn = document.getElementById('download-btn');
            
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
            statusDiv.style.display = 'block';
            
            const steps = [
                "> Connecting to secure build server...",
                "> Requesting unique signature...",
                "> Mutating binary payload...",
                "> Injecting junk instructions...",
                "> Finalizing build..."
            ];
            
            let currentStep = 0;
            statusDiv.innerHTML = '';
            
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    statusDiv.innerHTML += steps[currentStep] + '<br>';
                    currentStep++;
                } else {
                    clearInterval(interval);
                    statusDiv.innerHTML += "<span style='color: #fff;'>[+] Done! Starting download...</span>";
                    setTimeout(() => {
                        window.location.href = 'https://gamesense-revive.vercel.app/download';
                        setTimeout(() => {
                            statusDiv.style.display = 'none';
                            btn.style.pointerEvents = 'auto';
                            btn.style.opacity = '1';
                        }, 2000);
                    }, 500);
                }
            }, 800);
        });
    </script>
</body>

</html>
