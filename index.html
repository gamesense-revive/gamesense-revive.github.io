<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" dir="ltr">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="Cobalt.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>GameSense Revive</title>
    <style>
        a {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        a:hover {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }
        #build-status {
            display: none;
            font-family: monospace;
            color: #00ff66;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
            background: #111;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="punmaint" class="pun">
        <div class="top-box"></div>
        <div class="punwrap">

            <div id="brdmain">
                <div class="block">
                    <h2>Status</h2>
                    <div class="box">
                        <div class="inbox">
                            <div style="margin-bottom: 15px; font-weight: bold; font-size: 14px;">
                                Status: <span style="color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.4);">● UNDETECTED</span>
                            </div>
                            <p>The old era is gone. Welcome to GameSense Revive — redesigned, rebuilt, and ready.</p>
                            <br>
                            <p><a href="https://discord.gg/MPqZ9McqSA">Join us on discord</a></p>
                            <br>
                            <p><a id="download-btn">Download latest client</a></p>
                            
                            <div id="build-status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="end-box"></div>
    </div>

    <script>
        document.getElementById('download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('build-status');
            const btn = document.getElementById('download-btn');
            
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
            statusDiv.style.display = 'block';
            
            const steps = [
                "> Connecting to secure build server...",
                "> Requesting unique signature...",
                "> Mutating binary payload...",
                "> Injecting junk instructions...",
                "> Finalizing build..."
            ];
            
            let currentStep = 0;
            statusDiv.innerHTML = '';
            
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    statusDiv.innerHTML += steps[currentStep] + '<br>';
                    currentStep++;
                } else {
                    clearInterval(interval);
                    statusDiv.innerHTML += "<span style='color: #fff;'>[+] Done! Starting download...</span>";
                    setTimeout(() => {
                        window.location.href = 'https://gamesense-revive.vercel.app/download';
                        setTimeout(() => {
                            statusDiv.style.display = 'none';
                            btn.style.pointerEvents = 'auto';
                            btn.style.opacity = '1';
                        }, 2000);
                    }, 500);
                }
            }, 800);
        });
    </script>
</body>

</html>
