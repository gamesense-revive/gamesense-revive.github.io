<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en" dir="ltr">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" href="Cobalt.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>GameSense Revive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0c0c0c;
            overflow-x: hidden;
            user-select: none;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            justify-items: center;
            gap: 25px;
            perspective: 1000px;
        }

        .comparison-slider {
            position: relative;
            width: 640px;
            height: 360px;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.1);
            border: 1px solid #222;
            border-radius: 4px;
            overflow: hidden;
        }

        .image-before, .image-after {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: left center;
        }

        .image-before {
            background-image: url('before.jpg');
        }

        .image-after {
            background-image: url('after.jpg');
            width: 50%; 
        }

        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #00ff66;
            cursor: ew-resize;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
        }

        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 32px;
            height: 32px;
            background: #111;
            border: 2px solid #00ff66;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff66;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
            pointer-events: none;
        }

        .label {
            position: absolute;
            bottom: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 1px;
            z-index: 5;
            border: 1px solid #222;
        }

        .label-before {
            left: 15px;
            color: #888;
        }

        .label-after {
            right: 15px;
            color: #00ff66;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .pun .inbox p a {
            transition: all 0.2s ease-in-out;
            color: #ccc;
            text-decoration: none;
            cursor: pointer;
        }
        .pun .inbox p a:hover {
            color: #00ff66 !important;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .pun .block h2 {
            text-align: center;
            color: #eee;
        }
        .pun .box {
            background: #111111;
            border: 1px solid #222;
            padding: 20px;
            border-radius: 4px;
            width: 640px;
            box-sizing: border-box;
        }
        .pun .inbox {
            text-align: center;
            color: #ccc;
        }

        #build-status {
            display: none;
            font-family: monospace;
            color: #00ff66;
            margin-top: 15px;
            font-size: 12px;
            text-align: left;
            background: #080808;
            padding: 12px;
            border: 1px solid #222;
            border-radius: 4px;
            line-height: 1.6;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.05);
        }
    </style>
</head>

<body>
    <div id="punmaint" class="pun">
        <div class="top-box"></div>
        <div class="punwrap">

            <div id="brdmain">
                <div class="main-container">
                    
                    <div class="comparison-slider" id="slider-container">
                        <div class="image-before">
                            <span class="label label-before">DEFAULT GAME</span>
                        </div>
                        <div class="image-after" id="after-image">
                            <span class="label label-after">VISUALS ACTIVE</span>
                        </div>
                        <div class="slider-handle" id="drag-line">
                            <div class="slider-button">&lt;&gt;</div>
                        </div>
                    </div>

                    <div class="block">
                        <h2>Status</h2>
                        <div class="box">
                            <div class="inbox">
                                <div style="margin-bottom: 15px; font-weight: bold; font-size: 14px;">
                                    Status: <span style="color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.4);">● UNDETECTED</span>
                                </div>
                                <p>Welcome to GameSense Revive — redesigned, rebuilt, and ready.</p>
                                <br>
                                <p><a href="https://discord.gg/MPqZ9McqSA">Join us on discord</a></p>
                                <br>
                                <p><a id="download-btn">Download latest client</a></p>
                                
                                <div id="build-status"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="end-box"></div>
    </div>

    <script>
        const slider = document.getElementById('slider-container');
        const afterImage = document.getElementById('after-image');
        const dragLine = document.getElementById('drag-line');

        function moveSlider(x) {
            const rect = slider.getBoundingClientRect();
            let position = ((x - rect.left) / rect.width) * 100;

            if (position < 0) position = 0;
            if (position > 100) position = 100;

            afterImage.style.width = `${position}%`;
            dragLine.style.left = `${position}%`;
        }

        let isDragging = false;

        slider.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);

        slider.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            moveSlider(e.clientX);
        });

        slider.addEventListener('touchstart', () => isDragging = true);
        window.addEventListener('touchend', () => isDragging = false);

        slider.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            moveSlider(e.touches[0].clientX);
        });

        document.getElementById('download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('build-status');
            const btn = document.getElementById('download-btn');
            
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.5';
            statusDiv.style.display = 'block';
            
            const steps = [
                "> Connecting to secure build server...",
                "> Requesting unique signature...",
                "> Mutating binary payload...",
                "> Injecting junk instructions...",
                "> Finalizing build..."
            ];
            
            let currentStep = 0;
            statusDiv.innerHTML = '';
            
            const interval = setInterval(() => {
                if (currentStep < steps.length) {
                    statusDiv.innerHTML += steps[currentStep] + '<br>';
                    currentStep++;
                } else {
                    clearInterval(interval);
                    statusDiv.innerHTML += "<span style='color: #fff;'>[+] Done! Starting download...</span>";
                    setTimeout(() => {
                        window.location.href = 'https://gamesense-revive.vercel.app/download';
                        setTimeout(() => {
                            statusDiv.style.display = 'none';
                            btn.style.pointerEvents = 'auto';
                            btn.style.opacity = '1';
                        }, 2000);
                    }, 500);
                }
            }, 800);
        });
    </script>
</body>

</html>
